# Cloud / CPU rehearsal config. Paths are relative to the repository root.
# Numbers here are deliberately small so `python -m vccp all` finishes in
# minutes; nothing in the code path differs from the server run.

data_root: mini_data          # contains ref/ and processed/
vcc_root: mini_data/vcc       # challenge release files
output_root: runs
device: cpu                   # explicit: this container has no CUDA

run_name: mini
seed: 0

resources:
  cpu_threads: 4
  num_workers: 2
  gpu_memory_fraction: 0.5
  max_ram_gb: 64

# Budgets. Small enough that `all` finishes in minutes on CPU; the server
# config keeps the defaults. Nothing in the code path differs — only these
# numbers (CLAUDE.md §0).
train:
  output_genes_per_step: 256
  log_every: 25
  ablation_steps_fraction: 0.5

phase1:
  steps: 120
  batch_size: 16

phase2:
  steps: 150
  batch_size: 16
  cells_per_draw: 8

rehearsal:
  max_targets: 20
  adapt_steps: 40
  phase2_steps: 60

phase3:
  adapt_steps: 60
  batch_size: 16

sanity:
  # §6.1: on mini_data the statistics are noisy and warnings are expected, so
  # `all` is not blocked by them here. `server.yaml` leaves this off, where a
  # warning is worth stopping for. A **fail** stops the run either way.
  accept_warnings: true
