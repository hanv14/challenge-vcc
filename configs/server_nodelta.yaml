# SUPERSEDED — the question below is answered, and the answer is no.
#
# Run on seed 2 with the arms sharing an initialization and validation over
# 908 held-out targets, `without_delta` reaches 0.9984 at best and ends at
# 1.1554: the same flat line as `full`, against `none` falling monotonically
# to 0.7585. Resetting the per-gene table changes nothing, so the damage is
# in the core weights (DECISIONS.md D91), and `phase2.warm_start` now
# defaults to `none`.
#
# This file is kept for the record. Nothing needs it: `--set
# phase2.warm_start=without_delta` on any config does the same thing, and
# `configs/server_isolate.yaml` carries the curves all three settings
# produced.
#
# Does Phase 2 only need Phase 1's *network*, not its per-gene memory?
#
#     source scripts/server_env.sh
#     nice -n 10 ionice -c3 python -m vccp phase2 --config configs/server_nodelta.yaml --force
#
# The isolation run put the damage in the warm start itself rather than in
# the forgetting guard (DECISIONS.md D79). This asks which *part* of the warm
# start.
#
# `embedding(g) = W . prior(g) + delta(g)`, and `delta` is **4.74M of the
# model's 5.65M trainable parameters**. Phase 1 only ever tokenizes the 955
# panel genes, so a full warm start hands Phase 2 an embedding table where
# the panel has been moved by a bulk CRISPR-knockout objective and the other
# ~17,578 genes sit at `W . prior` alone. Phase 2's whole job is mapping the
# panel onto those rest genes, and it begins with the two halves on different
# footings — an asymmetry the from-scratch arm does not have, because there
# every `delta` is zero.
#
# `warm_start: without_delta` keeps the core, the projection W and the heads
# and resets `delta` to the zero §4.1 specifies it starts at.
#
# How to read it, against runs/server_isolate (same lr, steps and guards):
#
#   core_unfrozen ~= 0.80   the per-gene table was the damage; the network
#                           transfers fine. Three phases survive, and this
#                           becomes the shipped setting.
#   core_unfrozen ~= 0.99   the core weights themselves are the damage.
#                           warm_start: none, and the model is two-phase.
#
# Guards stay off so this differs from server_isolate.yaml in exactly one
# thing. It is therefore also a diagnostic rather than a submission config.

data_root: /data/han/projects/VCC/data
vcc_root: /data/share/han/VCC
output_root: /data/han/projects/VCC/runs
device: auto

run_name: server_nodelta
seed: 0

resources:
  cpu_threads: 4
  num_workers: 2
  gpu_memory_fraction: 0.5
  max_ram_gb: 64

train:
  deterministic: true
  output_genes_per_step: 2048
  # Must match the run this is compared against, or the difference is not
  # about Phase 1. The 6,000-step run used 0.0003; check your server.yaml
  # and change both together if it says otherwise.
  lr: 0.0003
  # The two the run is about. Both off, for every arm.
  l2sp_weight: 0.0
  replay_fraction: 0.0
  # With replay off, match_phase2_steps is a no-op and every arm gets the
  # full budget — so the comparison needs no correction at all.
  match_phase2_steps: true
  core_freeze_ablation: true
  phase1_contribution_ablation: true

phase1:
  steps: 400
  batch_size: 32

phase2:
  # Must match runs/server_isolate exactly, or the difference is not about
  # delta.
  steps: 6000
  batch_size: 32
  cells_per_draw: 16
  # The one thing that differs from server_isolate.yaml.
  warm_start: without_delta

rehearsal:
  max_targets: 100
  phase2_steps: 300
  adapt_steps: 150

phase3:
  adapt_steps: 300
  batch_size: 32

eval:
  de_backend: pdex
  build_scale: true

sanity:
  accept_warnings: false
