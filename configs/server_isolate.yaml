# Phase 2 with the forgetting guard removed, so one thing at a time is being
# measured.
#
#     source scripts/server_env.sh
#     nice -n 10 ionice -c3 python -m vccp phase2 --config configs/server_isolate.yaml --force
#
# A warm arm differs from `core_scratch` in three ways at once, and the first
# 6,000-step run could not say which one mattered:
#
#   1. the warm start itself — Phase 1's weights as the initialization
#   2. L2-SP — a penalty pulling the weights back toward Phase 1's
#   3. replay — a quarter of the steps spent on Phase 1's objective, which
#      interferes with Phase 2's even once the step *count* is matched
#
# This config removes 2 and 3 from every arm, so what remains between
# `core_unfrozen` and `core_scratch` is the warm start alone — and with
# replay off both arms get the same 6,000 Phase 2 steps by construction.
#
# Removing the guard is what makes this a *diagnostic* run and not a
# submission one: CLAUDE.md §4.3 requires replay and L2-SP, and Phase 1
# validation after Phase 2 is worse without them. Nothing here should be
# copied into server.yaml except, possibly, a changed l2sp_weight.
#
# ---------------------------------------------------------------------------
# What it has already answered, so that it is not asked a fourth time
# ---------------------------------------------------------------------------
#
# Three repeats of this config (`--seed 0`, `1`, `2`, every one reporting
# `phase1_contribution.arms_share_initialization: true`) put the gap between
# `core_scratch` and `core_unfrozen` on `pert_mse_ratio_to_no_change` at:
#
#     read at each arm's best   -0.091 +/- 0.045   (t = -2.0)
#     read at the last step     +0.023 +/- 0.022   (t = +1.1)
#
# The sign depends on which step it is read at, and "best of four
# evaluations" favours whichever arm is noisier — which is `core_scratch`,
# swinging between 0.82 and 1.06 while the warm arms sit between 0.98 and
# 1.00. So Phase 1's contribution is **not measurable at this budget**, the
# three-phase design of CLAUDE.md §4 stays, and re-running this to ask that
# question again costs 2.2 h and answers nothing (DECISIONS.md D86).
#
# What those runs did surface is the reason this config is still here: every
# arm ends at the no-change line, and the arm that learns most
# (`pert_pearson` 0.42 at step 3000, seed 2) ends at 0.02. The run passes
# through its best instead of converging on it. That is what to use this
# config for now — a learning-rate check:
#
#     for lr in 0.0001 0.00003; do
#       python -m vccp phase2 --config configs/server_isolate.yaml \
#         --run-name server_lr$lr --seed 2 --set train.lr=$lr
#     done
#
# with the two ablation arms off (see `train` below), which makes each run
# one arm of about 45 minutes. Read `signal_retained` — near 1.0 means the
# run ended at its best instead of passing through it — and `pert_pearson`
# at the *last* step rather than only in the middle.
#
# **That check has been run, and the answer is no** (D89): 0.0001 and
# 0.00003 are monotonically worse than 0.0003 and never beat the no-change
# baseline at all. The step size is not what is wrong. What is left is the
# measurement itself — `pert_mse_ratio_to_no_change` was scored over 32 of
# the 1,907 held-out targets, a number borrowed from `batch_size` by
# accident, and `phase2.eval_targets` now sets it (D88). The run worth
# doing next is both arms at 0.0003 with that fixed, to see whether
# `core_scratch`'s advantage survives a metric that can carry it.
#
# It writes to runs/server_isolate/, so it leaves the submission run alone.
# It needs a run directory that already has `priors` and Phase 1 — copy them
# in, or point output_root at the existing run and let `--force` redo only
# phase2.

data_root: /data/han/projects/VCC/data
vcc_root: /data/share/han/VCC
output_root: /data/han/projects/VCC/runs
device: auto

run_name: server_isolate
seed: 0

resources:
  cpu_threads: 4
  num_workers: 2
  gpu_memory_fraction: 0.5
  max_ram_gb: 64

train:
  deterministic: true
  output_genes_per_step: 2048
  # Must match the run this is compared against, or the difference is not
  # about Phase 1. Override it per run with `--set train.lr=...` rather than
  # editing this line, so every run's config.yaml records what it used.
  #
  # 0.0003 is the best of the three tested. 0.0001 and 0.00003 are
  # monotonically worse and never beat the no-change baseline at all, so the
  # collapse this config was pointed at is not a step-size problem (D89).
  lr: 0.0003
  # The two the run is about. Both off, for every arm.
  l2sp_weight: 0.0
  replay_fraction: 0.0
  # With replay off, match_phase2_steps is a no-op and every arm gets the
  # full budget — so the comparison needs no correction at all.
  match_phase2_steps: true
  # Both off by default now: the question they answer is settled (D86), and
  # with one arm a run is 45 minutes instead of 2.2 hours. Turn either back
  # on with `--set train.core_freeze_ablation=true` when there is a reason
  # to ask again — a changed learning rate that makes the arms converge
  # would be one.
  core_freeze_ablation: false
  phase1_contribution_ablation: false
  # Eight evaluations over 6,000 steps instead of four. The collapse these
  # runs found happened between two evaluation points 1,500 steps apart, so
  # at four there is no way to see when it starts (D85).
  evals_per_run: 8
  # More evaluations means more chances for "keep the best" to select on the
  # metric's own noise, which is why eval_targets below matters more here
  # than in the submission run.
  # Keep the weights the run measured as best. On by default; stated here
  # because this config's whole subject is runs that pass through their best.
  checkpoint_selection: best

phase1:
  steps: 400
  batch_size: 32

phase2:
  # These must match the run being compared against. Check them against your
  # server.yaml before reading anything into the difference.
  steps: 6000
  batch_size: 32
  cells_per_draw: 16
  # Left on: the question here is about the warm start, and `without_delta`
  # was measured and did not rescue it (D80, D84).
  warm_start: full
  # Every held-out target with a pseudobulk row, rather than the default 256
  # — this is a diagnostic run, and the whole difficulty has been reading a
  # metric noisier than the effects being read off it (D88).
  eval_targets: 0

rehearsal:
  max_targets: 100
  phase2_steps: 300
  adapt_steps: 150

phase3:
  adapt_steps: 300
  batch_size: 32

eval:
  de_backend: pdex
  build_scale: true

sanity:
  accept_warnings: false
