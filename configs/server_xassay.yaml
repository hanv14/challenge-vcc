# The cross-assay variant: learn from LINCS alone, adapt with controls only.
#
#     source scripts/server_env.sh
#     python -m vccp rehearsal --config configs/server_xassay.yaml --force
#
# Variants 1-3 all stay inside Replogle. This one learns what a perturbation
# does from LINCS only — bulk, CRISPR knockout — and meets a Replogle screen
# through its control cells alone, which is structurally what every
# submission does: the challenge is a different lab, protocol and sequencing
# depth from Replogle.
#
# It is **evidence for the write-up, not score for the leaderboard**: it
# cannot improve a submission, so it lives in its own run directory and never
# touches the one a submission came from.
#
# Read its two method arms against each other. They are the *same weights*
# asked through different perturbation-type rows — `method` as CRISPRi, which
# is what Phase 3 does, and `method_source_modality` as CRISPR knockout, the
# modality the weights learned. The gap is what Phase 1's knockout-specific
# offset is worth on a knockdown screen (CLAUDE.md §3.3, DECISIONS.md D72).
# If the two score the same, the type vocabulary is doing nothing there.
#
# Needs a run directory that already has `priors` and Phase 1; it retrains
# nothing, so it costs an adaptation, a prior rebuild and three scored arms
# per screen.

data_root: /data/han/projects/VCC/data
vcc_root: /data/share/han/VCC
output_root: /data/han/projects/VCC/runs
device: auto

run_name: server_xassay
seed: 0

resources:
  cpu_threads: 4
  num_workers: 2
  gpu_memory_fraction: 0.5
  max_ram_gb: 64

train:
  deterministic: true
  lr: 0.0003
  output_genes_per_step: 2048
  core_freeze_ablation: true

phase1:
  steps: 400
  batch_size: 32

phase2:
  # Matches server.yaml: 600 was too small to say anything, and the
  # from-scratch arm was still improving at 6,000.
  steps: 6000
  batch_size: 32
  cells_per_draw: 16

rehearsal:
  max_targets: 100
  phase2_steps: 300
  adapt_steps: 150
  calibration_thresholds: [0.0, 0.05, 0.1, 0.25]
  calibration_scales: [0.25, 0.5, 1.0, 1.5]

  # Learn from LINCS alone, adapt through control cells, score. The priors
  # hide **every** Replogle screen's responses, not just the scored one: the
  # arm has to learn what a perturbation does from LINCS, and a prior block
  # built on any single-cell screen's responses would be that knowledge
  # arriving by another route (DECISIONS.md D71).
  cross_assay: true
  # One screen. Each costs an adaptation, a prior rebuild and three arms.
  cross_assay_contexts: 1

phase3:
  adapt_steps: 300
  batch_size: 32

eval:
  de_backend: pdex
  build_scale: true

sanity:
  accept_warnings: false
